name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    name: Verify and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag and release metadata
        run: npm run release:check -- "$GITHUB_REF_NAME"

      - name: Verify types, tests, and build
        run: npm run verify

      - name: Enforce test coverage
        run: npm run coverage:check

      - name: Inspect publishable package
        run: npm run pack:check

      - name: Build release archive
        id: archive
        run: echo "path=$(npm pack --ignore-scripts)" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.archive.outputs.path }}"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
